# Netlify reads this file automatically — no settings to type in the Netlify UI.

[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Local dev with `npm run dev:netlify` (runs the site and the functions together)
[dev]
  command    = "npm run dev"
  targetPort = 5173
  port       = 8888
  framework  = "#custom"
  autoLaunch = false

# Single-page app: send every page URL to index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
